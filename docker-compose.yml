services:
  giveaway:
    build: .
    image: marshrut-postroen-giveaway:latest
    pull_policy: build
    restart: unless-stopped
    init: true
    shm_size: 512mb
    ports:
      - "9998:4310"
    environment:
      PUBLIC_URL: https://giveaway.marshrut-postroen.com
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      COLLECTOR_PROXY_SERVER: ${COLLECTOR_PROXY_SERVER:-}
      COLLECTOR_PROXY_USERNAME: ${COLLECTOR_PROXY_USERNAME:-}
      COLLECTOR_PROXY_PASSWORD: ${COLLECTOR_PROXY_PASSWORD:-}
    volumes:
      - giveaway-data:/app/data
    networks:
      proxy:
        aliases:
          - marshrut-giveaway
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  giveaway-data:
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-web}
