services:
  giveaway:
    build: .
    image: marshrut-postroen-giveaway:reels-v4
    pull_policy: build
    restart: unless-stopped
    init: true
    stop_grace_period: 3m
    ports:
      - "9998:4310"
    environment:
      PUBLIC_URL: https://giveaway.marshrut-postroen.com
    volumes:
      - giveaway-reels-data:/app/runtime
    networks:
      proxy:
        aliases:
          - marshrut-giveaway
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  giveaway-reels-data:
    external: true
    name: marshrut-giveaway_reels-data
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-web}
